<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hakuna Matata 구조 분석 대시보드</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
    .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;height:90vh}
    .card{background:#111827;border:1px solid #334155;border-radius:16px;padding:16px;overflow:auto}
    pre{white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px}
    button{padding:10px 14px;border:none;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer}
    .ok{color:#22c55e}.warn{color:#f59e0b}.bad{color:#ef4444}
  </style>
</head>
<body>
  <h1>📁 Hakuna Matata 구조 분석 대시보드</h1>
  <p><code>docs/structure.txt</code> + <code>docs/all-files.txt</code>를 자동 분석합니다.</p>
  <button onclick="loadAll()">새로고침</button>
  <div class="wrap">
    <div class="card"><h3>파일 트리</h3><pre id="tree"></pre></div>
    <div class="card"><h3>분석 리포트</h3><div id="report"></div></div>
  </div>
<script>
async function read(path){const r=await fetch(path); if(!r.ok) throw new Error(path); return r.text();}
function count(lines, re){return lines.filter(l=>re.test(l)).length}
async function loadAll(){
 try{
  const [tree, files] = await Promise.all([read('./structure.txt'), read('./all-files.txt')]);
  document.getElementById('tree').textContent = tree;
  const lines = files.split(/\r?\n/).filter(Boolean);
  const stats = {
    total: lines.length,
    tsx: count(lines,/\.tsx$/i),
    hooks: count(lines,/hooks/i),
    store: count(lines,/store/i),
    app: count(lines,/\\app\\|\/app\//i),
    components: count(lines,/components/i),
    api: count(lines,/route\.(ts|js)$|api/i),
    docs: count(lines,/\\docs\\|\/docs\//i),
  };
  const largest = {};
  lines.forEach(l=>{const parts=l.split(/\\|\//); const key=parts[parts.length-2]||'root'; largest[key]=(largest[key]||0)+1;});
  const top = Object.entries(largest).sort((a,b)=>b[1]-a[1]).slice(0,8);
  let html = `<p><b>총 파일:</b> ${stats.total}</p><p><b>TSX:</b> ${stats.tsx}</p>`;
  html += stats.components ? `<p class='ok'>✔ components 구조 존재</p>` : `<p class='bad'>✘ components 없음</p>`;
  html += stats.store ? `<p class='ok'>✔ 상태 관리 분리</p>` : `<p class='warn'>⚠ store 없음</p>`;
  html += stats.hooks ? `<p class='ok'>✔ custom hooks 존재</p>` : `<p class='warn'>⚠ hooks 적음</p>`;
  html += `<hr/><h4>비대 폴더 TOP</h4><ul>` + top.map(([k,v])=>`<li>${k}: ${v}</li>`).join('') + `</ul>`;
  html += `<hr/><h4>개발자 체크포인트</h4><ul>`;
  if(stats.tsx > 40) html += `<li class='warn'>UI 파일이 많아 화면 단위 분리 점검 필요</li>`;
  if(stats.app < 5) html += `<li class='warn'>App Router 페이지가 적고 단일 화면 집중형일 수 있음</li>`;
  if(top[0] && top[0][1] > 20) html += `<li class='bad'>${top[0][0]} 폴더 집중도 높음 → 리팩토링 후보</li>`;
  html += `<li>page.tsx 내부 비즈니스 로직이 길면 hooks/lib로 이동 권장</li>`;
  html += `<li>localStorage 로직은 lib/storage.ts 분리 권장</li>`;
  html += `</ul>`;
  document.getElementById('report').innerHTML = html;
 } catch(e){ document.getElementById('report').innerHTML = '<p class="bad">docs 폴더에 structure.txt / all-files.txt 확인</p>'; }
}
loadAll();
</script>
</body>
</html>
